    "accelerate>=1.0",
    "datasets>=5.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "safetensors>=0.4.5",
    "scipy>=1.13",
    "torch>=2.4",
    "transformers>=4.55",
]

