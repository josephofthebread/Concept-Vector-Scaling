[project]
name = "exp-trigger-prompts"
version = "0.1.0"
description = "Draft feature-activation trigger prompts with gpt-oss-120b for cherry-picked concept pairs"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "datasets>=2.19",
    "hf_transfer>=0.1",
    "huggingface-hub>=0.30",
    "igraph>=0.11",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "vllm==0.26.0",
]

[project.scripts]
trigger-generate = "exp_trigger_prompts.generate:main"
trigger-baselines = "exp_trigger_prompts.baselines:main"
trigger-calibrate = "exp_trigger_prompts.calibrate:main"
trigger-steer = "exp_trigger_prompts.steer:main"
trigger-judge = "exp_trigger_prompts.judge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
