[project]
name = "exp-gendataset"
version = "0.1.0"
description = "Generate the Feature Stories contrastive corpus (1,036 concept-antagonist pairs) through OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
