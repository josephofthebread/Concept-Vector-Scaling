[project]
name = "exp-lmsys-probe"
version = "0.1.0"
description = "Find, per concept vector, a natural lmsys message where it fires visibly (layer sweep)"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "datasets>=2.19",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pyarrow>=16",
    "safetensors>=0.4",
    "torch>=2.4",
    "transformers>=4.51",
    "vllm==0.26.0",
    "PyPDF2>=3.0",
]

[project.scripts]
lmsys-readout = "exp_lmsys_probe.readout:main"
lmsys-select = "exp_lmsys_probe.select:main"
lmsys-judge = "exp_lmsys_probe.judge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
